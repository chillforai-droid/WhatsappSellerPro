<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Seller Studio PRO</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--accent2:#374151;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:11px 14px}.topin{max-width:1250px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-weight:900}.logo small{display:block;font-size:10px;color:var(--muted);font-weight:600}
.wrap{max-width:1250px;margin:auto;padding:14px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:12px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap}.tab.active{background:var(--accent);color:#fff}
.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}h1{font-size:25px;margin:4px 0 5px}h2{font-size:17px;margin:0 0 9px}p{color:var(--muted);margin:6px 0 12px;line-height:1.45}
label{display:block;font-size:12px;font-weight:800;margin:10px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}input:focus,textarea:focus,select:focus{border-color:#6b7280}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:700;min-height:42px;touch-action:manipulation}.btn.alt{background:#eef0f3;color:#111827}.btn.danger{background:#fee2e2;color:#991b1b}.btn.success{background:#047857}.notice{padding:10px;border-radius:11px;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;margin-top:10px}
.list{display:grid;gap:8px;margin-top:10px}.item{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.itemline{display:flex;justify-content:space-between;gap:10px;align-items:center}.itemline>.actions{margin-top:0}.muted{color:var(--muted);font-size:12px}
.status-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.status-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px}.status-preview{aspect-ratio:9/16;border-radius:11px;overflow:hidden;position:relative;background:var(--status-bg,#f4efe7);color:var(--status-text,#111)}.status-preview .photo{position:absolute;left:8%;right:8%;top:24%;height:43%;border-radius:12px;overflow:hidden;background:#ddd;display:grid;place-items:center;color:#777}.status-preview .photo img{width:100%;height:100%;object-fit:cover}.s-shop{position:absolute;top:6%;left:7%;right:7%;text-align:center;font-size:4.5%;font-weight:900}.s-city{position:absolute;top:10%;left:7%;right:7%;text-align:center;font-size:2.6%;color:#666}.s-head{position:absolute;top:70%;left:6%;right:6%;text-align:center;font-size:6.3%;font-weight:900}.s-product{position:absolute;top:76%;left:6%;right:6%;text-align:center;font-size:3.2%}.s-extra{position:absolute;top:81%;left:6%;right:6%;text-align:center;font-size:2.8%;color:#666}.s-cta{position:absolute;bottom:8%;left:18%;right:18%;padding:3% 2%;background:var(--status-accent,#111);color:#fff;border-radius:999px;text-align:center;font-size:2.9%;font-weight:900}
.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.prod{border:1px solid var(--line);border-radius:15px;padding:10px}.prodphoto{aspect-ratio:1;background:#eee;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:#888}.prodphoto img{width:100%;height:100%;object-fit:cover}.price{font-weight:900;font-size:20px}.search{margin-bottom:10px}.small{font-size:11px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:100}.modal.show{display:flex}.sheet{background:#fff;width:min(700px,100%);max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
@media(max-width:900px){.status-grid{grid-template-columns:repeat(3,1fr)}.catalog{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.grid,.grid3,.row{grid-template-columns:1fr}.status-grid{grid-template-columns:repeat(2,1fr)}.catalog{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}.card{border-radius:14px;padding:12px}.topin{align-items:flex-start}.top .actions{gap:5px}.top .btn{padding:8px 9px;font-size:12px}.itemline{align-items:flex-start;flex-direction:column}.itemline>.actions{width:100%}.itemline>.actions .btn{flex:1}.modal .sheet{max-height:94vh}}
.logo-preview{width:56px;height:56px;border-radius:14px;object-fit:contain;background:#f3f4f6;border:1px solid #e5e7eb;display:block;margin:8px 0}.onboard{position:fixed;inset:0;background:#0008;z-index:10000;display:flex;align-items:center;justify-content:center;padding:14px}.onboard .box{background:#fff;color:#111827;max-width:520px;width:100%;border-radius:22px;padding:22px;box-shadow:0 20px 60px #0005}
</head>
<body><div id="welcome" class="onboard" style="display:none"><div class="box"><div class="itemline"><h2>👋 Welcome to Seller Studio PRO</h2><button class="btn alt" onclick="closeWelcome()">Close</button></div><p>यह private WhatsApp selling workspace है। कोई account या subscription जरूरी नहीं है।</p><div class="notice"><b>Start in 3 steps:</b><br>1. Brand में shop details भरें<br>2. Products में products + photos जोड़ें<br>3. Templates/Catalogue से selling assets बनाएं</div><div class="actions"><button class="btn" onclick="loadDemoStore();closeWelcome()">🎯 Load Demo Store</button><button class="btn alt" onclick="closeWelcome()">Start Empty</button></div><p class="muted">Tip: काम शुरू करने के बाद Backup जरूर डाउनलोड करें।</p></div></div>
<header class="top"><div class="topin"><div class="logo">Seller Studio PRO<small>WhatsApp selling system • offline-first</small></div><div class="actions" style="margin:0"><button class="btn alt" onclick="openGuide()">📖 Guide</button><button class="btn alt" onclick="exportBackup()">Backup</button><button class="btn" onclick="saveAll()">Save</button></div></div></header>
<main class="wrap">
<nav class="tabs">
<button class="tab active" data-tab="dashboard">🏠 Dashboard</button>
<button class="tab" data-tab="brand">🎨 Brand</button>
<button class="tab" data-tab="products">🛍️ Products</button>
<button class="tab" data-tab="templates">📱 Templates</button>
<button class="tab" data-tab="messages">💬 Messages</button>
<button class="tab" data-tab="catalogue">🛒 Catalogue</button>
<button class="tab" data-tab="tools">🧰 Tools</button>
</nav>

<section id="dashboard" class="panel active">
<div class="grid">
<div class="card"><h1 id="dashName">Your Shop</h1><p id="dashTag">Set up your brand and start adding products.</p><div class="notice">Everything is stored locally in this browser. No account or server required.</div><div class="actions"><button class="btn" onclick="openGuide()">📖 Read Full Guide</button><button class="btn alt" onclick="showQuickStart()">⚡ Quick Start</button><button class="btn alt" onclick="loadDemoStore()">🎯 Demo Store</button></div></div>
<div class="card"><h2>Quick start</h2><ol class="muted"><li>Brand में shop details भरें.</li><li>Products में जितने चाहें products जोड़ें.</li><li>Templates में अपना design बनाएं.</li><li>Catalogue और WhatsApp links share करें.</li></ol></div>
</div>
<div class="grid3" style="margin-top:14px"><div class="card"><b id="countProducts">0</b><div class="muted">Products</div></div><div class="card"><b id="countTemplates">6</b><div class="muted">Template styles</div></div><div class="card"><b>100+</b><div class="muted">Message ideas</div></div></div>
</section>

<section id="brand" class="panel">
<div class="grid">
<div class="card"><h2>Shop identity</h2>
<label>Shop name</label><input id="shopName">
<label>Tagline</label><input id="tagline">
<div class="row"><div><label>WhatsApp number</label><input id="wa" inputmode="numeric" placeholder="919876543210"></div><div><label>City</label><input id="city"></div></div>
<label>Logo (optional)</label><input id="logo" placeholder="Logo URL or upload below"><input id="logoFile" type="file" accept="image/*" onchange="previewLogo(event)"><div id="logoName" class="muted">No logo selected</div>
<label>Default CTA</label><input id="cta" value="WHATSAPP TO ORDER">
<div class="row"><div><label>Primary color</label><input id="primary" type="color" value="#111827"></div><div><label>Accent color</label><input id="accent" type="color" value="#047857"></div></div>
<div class="actions"><button class="btn success" onclick="saveAll()">Save Brand</button><button class="btn alt" onclick="resetBrand()">Reset</button></div></div>
<div class="card"><h2>Freedom settings</h2><p>यह app किसी एक clothing category तक सीमित नहीं है। Shop owner products, prices, sizes, colors और messages अपने हिसाब से बदल सकता है।</p>
<div class="notice">No hard-coded shop name, phone number, product price or category is required.</div></div>
</div>
</section>

<section id="products" class="panel">
<div class="card"><h1>Product Manager</h1><p>Unlimited products add करें। Product photo phone से सीधे upload करें। Images browser में locally store होती हैं।</p>
<div class="grid">
<div><label>Product name</label><input id="pn">
<label>Price</label><input id="pp" type="number">
<label>Compare-at price (optional)</label><input id="pc" type="number">
<label>Category</label><input id="pca" placeholder="Kurti / Saree / Shirt">
<label>Sizes</label><input id="ps" placeholder="S / M / L / XL">
<label>Colors</label><input id="pcol" placeholder="Pink, Black">
<label>Product Photo</label><input id="pi" type="file" accept="image/*" onchange="previewLocalImage(event)"><div id="imageName" class="muted">No photo selected</div>
<label>Description</label><textarea id="pd" rows="3"></textarea>
<div class="actions"><button class="btn success" onclick="addProduct()">Add Product</button><button class="btn alt" onclick="clearProductForm()">Clear</button></div></div>
<div><input class="search" id="productSearch" placeholder="Search products..." oninput="renderProducts()"><div id="productList" class="list"></div></div>
</div></div>
</section>

<section id="templates" class="panel">
<div class="card"><h1>Template Studio</h1><p>6 ready styles + custom headline, CTA, colors and product. Downloadable SVG is generated in the browser.</p>
<div class="grid">
<div><label>Template style</label><select id="tplStyle"></select>
<label>Product</label><select id="tplProduct"></select>
<label>Headline</label><input id="tplHeadline" value="NEW ARRIVAL">
<label>Subtext</label><input id="tplSub" value="Limited collection • Ask for details">
<label>CTA</label><input id="tplCta">
<div class="actions"><button class="btn success" onclick="makeTemplate()">Generate</button><button class="btn" onclick="downloadSVG()">Download SVG</button><button class="btn alt" onclick="downloadPNG()">Download PNG</button><button class="btn alt" onclick="printStatus()">Print / Save PDF</button></div></div>
<div id="templatePreview"></div>
</div>
</div>
</section>

<section id="messages" class="panel">
<div class="card"><h1>Message Studio</h1><p>100+ messages edit, search, copy और अपने messages add कर सकते हैं.</p>
<div class="actions"><input id="msgSearch" class="search" placeholder="Search messages..." oninput="renderMessages()" style="flex:1"><button class="btn" onclick="openMessageAdd()">+ Add message</button></div>
<div id="messageList" class="list"></div></div>
</section>

<section id="catalogue" class="panel">
<div class="card"><h1>Mobile Catalogue</h1><p>Products से automatic catalogue बनता है. इसे standalone HTML के रूप में export कर सकते हैं.</p>
<div class="actions"><button class="btn success" onclick="openCatalogue()">Open Catalogue</button><button class="btn" onclick="downloadCatalogue()">Download HTML</button></div>
<div id="cataloguePreview" class="catalog" style="margin-top:12px"></div></div>
</section>

<section id="tools" class="panel">
<div class="grid">
<div class="card"><h2>WhatsApp Order Link</h2><label>Product</label><select id="orderProduct"></select><label>Message</label><textarea id="orderMessage" rows="4">Hi, I want to order this product.</textarea><div class="actions"><button class="btn success" onclick="generateOrder()">Generate</button><button class="btn alt" onclick="copyOrder()">Copy</button></div><div id="orderLink" class="notice" style="word-break:break-all">—</div></div>
<div class="card"><h2>Profit Calculator</h2><label>Buying price</label><input id="buy" type="number" value="350"><label>Selling price</label><input id="sell" type="number" value="599"><label>Other cost</label><input id="cost" type="number" value="0"><div class="notice" id="profit">Profit: ₹249</div></div>
</div>
<div class="card" style="margin-top:14px"><h2>Backup & Restore</h2><p>Customer को freedom देने के लिए data export/import रखा गया है. Backup JSON file में products, brand और custom messages सुरक्षित किए जा सकते हैं.</p><div class="actions"><button class="btn" onclick="exportBackup()">Export Backup</button><label class="btn alt" style="display:inline-block">Import Backup <input id="importFile" type="file" accept=".json" hidden onchange="importBackup(event)"></label></div></div>
<div class="card" style="margin-bottom:14px"><h2>🧪 Demo & Reset</h2><p>Demo store से पूरा workflow तुरंत देखें। Reset करने से current local data हटेगा—पहले Backup लें।</p><div class="actions"><button class="btn" onclick="loadDemoStore()">Load Demo Store</button><button class="btn alt" onclick="factoryReset()">Factory Reset</button></div></div></section>
<footer style="text-align:center;padding:18px;color:#6b7280;font-size:12px">Seller Studio PRO • Offline-first • Licensed digital product • Backup your data regularly</footer></main>

<div id="guideModal" class="modal"><div class="sheet"><div class="itemline"><h2>📖 Seller Studio — Full Guide</h2><button class="btn alt" onclick="closeGuide()">Close</button></div><div class="card" style="margin-top:10px"><h2>1. Brand</h2><p>Brand tab में Shop Name, Tagline, WhatsApp Number, City और colors भरें और Save Brand दबाएँ.</p><h2>2. Products</h2><p>Products tab में नाम, price, category, sizes, colors, description और phone से product photo जोड़ें. Add Product दबाएँ.</p><h2>3. Status</h2><p>Templates में style और product चुनें, headline/subtext/CTA बदलें, Generate दबाएँ. Download SVG से file मिलेगी.</p><h2>4. Messages</h2><p>Messages में search और Copy करें. Add message से अपने messages जोड़ें.</p><h2>5. Catalogue</h2><p>Catalogue में Open Catalogue या Download HTML करें.</p><h2>6. WhatsApp Order</h2><p>Tools में product चुनकर Generate करें. WhatsApp number country code सहित रखें, जैसे 919876543210.</p><h2>7. Backup</h2><p>Backup से JSON file रखें. दूसरे browser/device पर Import Backup करें.</p><h2>8. Privacy</h2><p>Data browser में local storage में रहता है. Browser data clear करने से पहले backup लें. केवल अपने/licensed images और वास्तविक claims इस्तेमाल करें.</p><div class="notice"><b>Best workflow:</b> Brand → Products → Templates → Messages → Catalogue → Order Links → Backup.</div></div></div></div><div id="modal" class="modal"><div class="sheet"><div class="itemline"><h2 id="modalTitle">Add</h2><button class="btn alt" onclick="closeModal()">Close</button></div><div id="modalBody"></div></div></div>

<script src="/app.js" defer></script>
</body></html>
